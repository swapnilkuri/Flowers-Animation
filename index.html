<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flowers for You</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at center, #0f1f1a 0%, #060b0a 100%);
      overflow: hidden;
      height: 100vh;
      font-family: 'Georgia', serif;
      color: #fff;
      position: relative;
      user-select: none;
    }

    /* Tap-to-Play Overlay */
    #start-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #060b0a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      cursor: pointer;
      transition: opacity 1.2s ease, visibility 1.2s;
    }

    #start-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .start-text {
      font-size: 14px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(220, 245, 230, 0.8);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Message Header */
    .message-container {
      position: absolute;
      top: 3%;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 480px;
      z-index: 10;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.95);
      padding: 6px 12px;
    }

    .message-container.show {
      animation: fadeIn 2.5s ease 1s forwards;
    }

    .subtitle-top {
      font-size: 14px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(220, 240, 230, 0.75);
      margin-bottom: 6px;
    }

    h1 {
      font-size: clamp(34px, 8vw, 44px);
      font-weight: 400;
      margin-bottom: 12px;
      letter-spacing: 1.5px;
      color: #f7faf8;
    }

    p {
      font-size: clamp(15px, 4vw, 18px);
      font-style: italic;
      color: rgba(230, 245, 238, 0.95);
      line-height: 1.6;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <div id="start-screen">
    <div class="start-text">Tap to open</div>
  </div>

  <audio id="bg-music" loop preload="auto">
    <source src="music.mp3" type="audio/mp3">
  </audio>

  <div class="message-container" id="message-box">
    <div class="subtitle-top">Hey</div>
    <h1>Caccapino</h1>
    <p>No matter where life takes you, remember to be yourself. You truly have the prettiest smile, so never let anything take it away. Wishing you peace, happiness, and all the good things in life. God bless you dear. These flowers are for you 🌸</p>
  </div>

  <canvas id="garden"></canvas>

  <script>
    const canvas = document.getElementById('garden');
    const ctx = canvas.getContext('2d');
    const startScreen = document.getElementById('start-screen');
    const messageBox = document.getElementById('message-box');
    const music = document.getElementById('bg-music');

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let started = false;

    class GingerLily {
      constructor(x, targetHeight, delay) {
        this.x = x;
        this.baseY = height;
        this.targetHeight = targetHeight;
        this.currentHeight = 0;
        this.stemGrowthSpeed = Math.random() * 1.5 + 1.8;
        this.delay = delay;
        this.age = 0;
        this.curve = (Math.random() - 0.5) * 28;

        this.bloomScale = 0;
        this.bloomSpeed = 0.02 + Math.random() * 0.015;
        this.stemColor = `hsl(${135 + Math.random() * 15}, 35%, ${22 + Math.random() * 10}%)`;
        this.size = Math.random() * 5 + 16;
        this.tilt = (Math.random() - 0.5) * 0.28;
      }

      getHeadPos() {
        const currentY = this.baseY - this.currentHeight;
        const progress = this.targetHeight > 0 ? (this.currentHeight / this.targetHeight) : 0;
        const curveX = this.x + Math.sin(progress * Math.PI) * this.curve;
        return { x: curveX, y: currentY };
      }

      update() {
        if (!started) return;
        if (this.age < this.delay) {
          this.age++;
          return;
        }

        if (this.currentHeight < this.targetHeight) {
          this.currentHeight += this.stemGrowthSpeed;
          if (this.currentHeight > this.targetHeight) {
            this.currentHeight = this.targetHeight;
          }
        } else if (this.bloomScale < 1) {
          this.bloomScale += this.bloomSpeed;
          if (this.bloomScale > 1) this.bloomScale = 1;
        }
      }

      draw() {
        if (this.age < this.delay || !started) return;

        const pos = this.getHeadPos();
        const currentY = pos.y;
        const curveX = pos.x;
        const progress = this.currentHeight / this.targetHeight;

        // Stem
        ctx.beginPath();
        ctx.strokeStyle = this.stemColor;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.moveTo(this.x, this.baseY);
        ctx.quadraticCurveTo(
          this.x + this.curve * 0.6,
          this.baseY - this.currentHeight / 2,
          curveX,
          currentY
        );
        ctx.stroke();

        // Foliage
        if (progress > 0.35) {
          const leafY = this.baseY - this.targetHeight * 0.35;
          const leafX = this.x + Math.sin(0.35 * Math.PI) * this.curve;
          this.drawLeaf(leafX, leafY, -1, 30, 10);
        }
        if (progress > 0.65) {
          const leafY = this.baseY - this.targetHeight * 0.65;
          const leafX = this.x + Math.sin(0.65 * Math.PI) * this.curve;
          this.drawLeaf(leafX, leafY, 1, 24, 8);
        }

        // Bloom
        if (this.bloomScale > 0) {
          this.drawLilyBloom(curveX, currentY);
        }
      }

      drawLeaf(x, y, dir, length, width) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate((dir * Math.PI) / 4.5);
        ctx.beginPath();
        ctx.fillStyle = this.stemColor;
        ctx.ellipse(dir * (length * 0.5), 0, length * 0.6, width * 0.6, (dir * Math.PI) / 9, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      drawLilyBloom(x, y) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(this.tilt);

        const s = this.size * this.bloomScale;

        // Soft glow
        const glow = ctx.createRadialGradient(0, 0, s * 0.2, 0, 0, s * 1.4);
        glow.addColorStop(0, 'rgba(255, 255, 255, 0.15)');
        glow.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(0, 0, s * 1.4, 0, Math.PI * 2);
        ctx.fill();

        // 1. Back Upper Sepal
        ctx.fillStyle = 'rgba(240, 248, 242, 0.88)';
        ctx.beginPath();
        ctx.ellipse(0, -s * 0.85, s * 0.2, s * 0.6, 0, 0, Math.PI * 2);
        ctx.fill();

        // 2. Lateral Wing Petals
        ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
        ctx.beginPath();
        ctx.ellipse(-s * 0.6, -s * 0.18, s * 0.55, s * 0.32, -Math.PI / 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.ellipse(s * 0.6, -s * 0.18, s * 0.55, s * 0.32, Math.PI / 5, 0, Math.PI * 2);
        ctx.fill();

        // 3. Labellum
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.ellipse(-s * 0.25, s * 0.3, s * 0.42, s * 0.38, Math.PI / 8, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.ellipse(s * 0.25, s * 0.3, s * 0.42, s * 0.38, -Math.PI / 8, 0, Math.PI * 2);
        ctx.fill();

        // 4. Center Throat
        const centerGrad = ctx.createRadialGradient(0, 0, 1, 0, s * 0.1, s * 0.4);
        centerGrad.addColorStop(0, 'rgba(244, 232, 140, 0.9)');
        centerGrad.addColorStop(0.7, 'rgba(244, 232, 140, 0.4)');
        centerGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = centerGrad;
        ctx.beginPath();
        ctx.ellipse(0, s * 0.1, s * 0.4, s * 0.3, 0, 0, Math.PI * 2);
        ctx.fill();

        // 5. Stamen & Anther
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(225, 245, 215, 0.95)';
        ctx.lineWidth = 1.5;
        ctx.moveTo(0, s * 0.15);
        ctx.quadraticCurveTo(s * 0.3, -s * 0.6, 0, -s * 1.05);
        ctx.stroke();

        ctx.fillStyle = '#f0e68c';
        ctx.beginPath();
        ctx.arc(0, -s * 1.05, 1.8, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    // Little Butterfly Class
    class Butterfly {
      constructor(targetFlower, delay, color) {
        this.targetFlower = targetFlower;
        this.delay = delay;
        this.age = 0;
        this.color = color;
        
        // Spawn from upper sides
        this.x = Math.random() < 0.5 ? -30 : width + 30;
        this.y = Math.random() * (height * 0.45);
        
        this.wingAngle = 0;
        this.wingSpeed = 0.25;
        this.size = 5.5 + Math.random() * 2.5;
        this.isLanded = false;
        this.wobblePhase = Math.random() * Math.PI * 2;
      }

      update() {
        if (!started) return;
        if (this.age < this.delay) {
          this.age++;
          return;
        }

        // Wait until target flower has finished blooming
        if (this.targetFlower.bloomScale < 0.95) return;

        const target = this.targetFlower.getHeadPos();
        // Land slightly to the side/top of the flower head
        const destX = target.x + (Math.sin(this.wobblePhase) * 3);
        const destY = target.y - this.targetFlower.size * 0.5;

        const dx = destX - this.x;
        const dy = destY - this.y;
        const dist = Math.hypot(dx, dy);

        if (dist > 2 && !this.isLanded) {
          // Flight path with flutter wave
          this.wobblePhase += 0.08;
          const speed = Math.min(2.0, Math.max(0.7, dist * 0.015));
          const angle = Math.atan2(dy, dx);

          this.x += Math.cos(angle) * speed + Math.sin(this.wobblePhase) * 0.8;
          this.y += Math.sin(angle) * speed + Math.cos(this.wobblePhase * 1.2) * 0.6;
          this.wingSpeed = 0.28;
        } else {
          // Landed on flower
          this.isLanded = true;
          this.x = destX;
          this.y = destY;
          // Gentle resting flutter
          this.wingSpeed = 0.04;
        }

        this.wingAngle += this.wingSpeed;
      }

      draw() {
        if (this.age < this.delay || !started) return;
        if (this.targetFlower.bloomScale < 0.95 && !this.isLanded) return;

        ctx.save();
        ctx.translate(this.x, this.y);

        const wingFlap = Math.abs(Math.sin(this.wingAngle)); // 0 to 1
        const s = this.size;

        // Subtle warm glow around butterfly
        ctx.beginPath();
        ctx.fillStyle = `rgba(255, 255, 255, 0.25)`;
        ctx.arc(0, 0, s * 1.2, 0, Math.PI * 2);
        ctx.fill();

        // Left wing
        ctx.save();
        ctx.scale(wingFlap, 1);
        ctx.fillStyle = this.color.wing;
        ctx.beginPath();
        ctx.ellipse(-s * 0.6, -s * 0.3, s * 0.8, s * 0.45, -Math.PI / 4, 0, Math.PI * 2);
        ctx.fill();
        // Wing interior tint
        ctx.fillStyle = this.color.tint;
        ctx.beginPath();
        ctx.ellipse(-s * 0.55, -s * 0.25, s * 0.45, s * 0.25, -Math.PI / 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Right wing
        ctx.save();
        ctx.scale(wingFlap, 1);
        ctx.fillStyle = this.color.wing;
        ctx.beginPath();
        ctx.ellipse(s * 0.6, -s * 0.3, s * 0.8, s * 0.45, Math.PI / 4, 0, Math.PI * 2);
        ctx.fill();
        // Wing interior tint
        ctx.fillStyle = this.color.tint;
        ctx.beginPath();
        ctx.ellipse(s * 0.55, -s * 0.25, s * 0.45, s * 0.25, Math.PI / 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Butterfly Body
        ctx.fillStyle = '#2b261d';
        ctx.beginPath();
        ctx.ellipse(0, 0, 1.2, s * 0.6, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    // Generate Flowers (Capped between 18% and 36% of screen height)
    const flowers = [];
    const count = 26;
    const spacing = width / count;

    for (let i = 0; i < count; i++) {
      const posX = i * spacing + (Math.random() - 0.5) * spacing * 0.85;
      const targetH = Math.random() * (height * 0.18) + (height * 0.18);
      const delay = Math.random() * 80;
      flowers.push(new GingerLily(posX, targetH, delay));
    }

    flowers.sort((a, b) => a.targetHeight - b.targetHeight);

// Enhanced Pastel Color Palette for Butterflies
    const butterflyColors = [
      { wing: '#ffcad4', tint: '#ffffff' }, // blush pink
      { wing: '#ffe599', tint: '#fff8db' }, // pale golden yellow
      { wing: '#c5e3f6', tint: '#ffffff' }, // soft sky blue
      { wing: '#e2cfea', tint: '#ffffff' }, // lavender
      { wing: '#ffd6a5', tint: '#fff0e1' }, // peach
      { wing: '#caffbf', tint: '#f2ffed' }, // soft mint green
      { wing: '#ffb4d6', tint: '#FF2E00' }, 
      { wing: '#ffb4d6', tint: '#FF2E00' },
      { wing: '#ffb4d6', tint: '#FF2E00' },
      { wing: '#ffb4d6', tint: '#00F0E6' }, 
      { wing: '#ffb4d6', tint: '#00F0E6' },
      { wing: '#ffb4d6', tint: '#00F0E6' }// rose pink
    ];

    const butterflies = [];
    const totalButterflies = 12; // Increased count
    const chosenIndices = [];

    // Select random flowers for butterflies to land on
    while (chosenIndices.length < totalButterflies) {
      const r = Math.floor(Math.random() * flowers.length);
      chosenIndices.push(r); // Allows flowers to occasionally share butterflies naturally
    }

    chosenIndices.forEach((flowerIdx, i) => {
      const color = butterflyColors[i % butterflyColors.length];
      const flyDelay = 110 + i * 22; // Staggered arrival timings
      butterflies.push(new Butterfly(flowers[flowerIdx], flyDelay, color));
    });

    // Ambient floating particles
    const particles = Array.from({ length: 22 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      size: Math.random() * 1.8 + 1,
      speedY: Math.random() * -0.35 - 0.15,
      opacity: Math.random() * 0.4 + 0.15
    }));

    function animate() {
      ctx.clearRect(0, 0, width, height);

      particles.forEach(p => {
        p.y += p.speedY;
        if (p.y < 0) p.y = height;
        ctx.beginPath();
        ctx.fillStyle = `rgba(220, 245, 230, ${p.opacity})`;
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });

      flowers.forEach(flower => {
        flower.update();
        flower.draw();
      });

      butterflies.forEach(b => {
        b.update();
        b.draw();
      });

      requestAnimationFrame(animate);
    }

    animate();

    startScreen.addEventListener('click', () => {
      started = true;
      startScreen.classList.add('hidden');
      messageBox.classList.add('show');
      
      music.play().catch(e => {
        console.log("Audio play error:", e);
      });
    });
  </script>
</body>
</html>
